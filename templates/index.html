<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockAI | Next-Gen Predictions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc; /* Neon Cyan */
            --secondary: #7000ff; /* Electric Purple */
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }

        body {
            background-color: var(--bg);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 🌌 Animated Mesh Gradient Background */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 204, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(112, 0, 255, 0.15) 0%, transparent 40%);
            filter: blur(80px);
        }

        /* 🖱️ Floating Particles Effect (Simple CSS version) */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        .hero-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 60px;
            max-width: 900px;
            width: 95%;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Neon Line at Top */
        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 150px; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 0 0 10px 10px;
            box-shadow: 0 0 20px var(--primary);
        }

        .badge {
            background: rgba(0, 255, 204, 0.1);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 20px;
            font-weight: 700;
        }

        h1 span {
            background: linear-gradient(to bottom right, #fff 30%, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .highlight {
            color: var(--primary);
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
            -webkit-text-fill-color: var(--primary) !important;
        }

        p {
            color: #888;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 40px;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .main-btn {
            background: white;
            color: black;
            padding: 20px 45px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 255, 255, 0.2);
        }

        .sec-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            padding: 20px 45px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .sec-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 📈 Live Status Dot */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #555;
        }

        .dot {
            width: 8px; height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Desktop Mockup Decoration */
        .decoration {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 100px;
            background: linear-gradient(180deg, var(--primary) 0%, transparent 100%);
            opacity: 0.1;
            filter: blur(50px);
        }

    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="hero-card">
        <div class="badge">Artificial Intelligence v2.0</div>
        <h1><span>Predict the</span> <br> <span class="highlight">Future Market.</span></h1>
        <p>Harness the power of LSTM Neural Networks to forecast stock trends with institutional-grade precision.</p>
        
        <div class="btn-group">
            <a href="/dashboard" class="main-btn">
                Launch Terminal <i class="fas fa-arrow-right"></i>
            </a>
            <!-- <a href="#" class="sec-btn">How it works</a> -->
        </div>

        <div class="status">
            <div class="dot"></div>
            50+ Neural Models Active & Trained
        </div>
    </div>

    <div class="decoration"></div>
</body>
</html>
